name: apt-install
description: >-
  Installs Ubuntu packages from the .debs cached for this runner image, with no
  network, and otherwise from the mirror (.github/scripts/apt-install.sh); then
  caches what it downloaded. A pull request reads the caches of its base branch,
  which apt-cache.yaml fills.
inputs:
  packages:
    description: Space-separated package names.
    required: true
  seed:
    description: "'true' only fills the cache: nothing runs when this image's .debs are cached."
    default: 'false'
runs:
  using: composite
  steps:
  - name: Name the .deb cache
    id: name
    shell: bash
    env:
      PACKAGES: ${{ inputs.packages }}
    run: |
      sum=$(printf '%s\n' "$PACKAGES" | cat - "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" | sha256sum | cut -c1-16)
      prefix="apt-v1-${ImageOS:-$RUNNER_OS}-$RUNNER_ARCH-$sum-"
      printf 'dir=%s\nprefix=%s\nkey=%s\n' "$RUNNER_TEMP/apt-debs" "$prefix" "$prefix${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
  # Another image's .debs usually still install; when they do not, the script downloads.
  - name: Restore the .debs
    id: restore
    uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ${{ steps.name.outputs.dir }}
      key: ${{ steps.name.outputs.key }}
      restore-keys: ${{ inputs.seed != 'true' && steps.name.outputs.prefix || '' }}
      lookup-only: ${{ inputs.seed == 'true' }}
  - name: Install ${{ inputs.packages }}
    if: inputs.seed != 'true' || steps.restore.outputs.cache-hit != 'true'
    shell: bash
    env:
      APT_DEBS: ${{ steps.name.outputs.dir }}
      PACKAGES: ${{ inputs.packages }}
    run: |
      read -r -a packages <<<"$PACKAGES"
      bash "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" "${packages[@]}"
  - name: Save the .debs
    if: steps.restore.outputs.cache-hit != 'true'
    continue-on-error: true
    uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ${{ steps.name.outputs.dir }}
      key: ${{ steps.name.outputs.key }}

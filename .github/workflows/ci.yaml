name: CI
'on':
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.draft && format('draft-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  select:
    name: Select suites
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.select.outputs.go }}
      go_shards: ${{ steps.select.outputs.go_shards }}
      server: ${{ steps.select.outputs.server }}
      authkit_adapter: ${{ steps.select.outputs.authkit_adapter }}
      openrails_adapter: ${{ steps.select.outputs.openrails_adapter }}
      media_image: ${{ steps.select.outputs.media_image }}
      media_video: ${{ steps.select.outputs.media_video }}
      ui: ${{ steps.select.outputs.ui }}
      ui_unit: ${{ steps.select.outputs.ui_unit }}
      ui_browser: ${{ steps.select.outputs.ui_browser }}
      images: ${{ steps.select.outputs.images }}
      workflow: ${{ steps.select.outputs.workflow }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
    - name: Verify tested merge
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        python3 - <<'PY'
        import os, subprocess
        tested = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        if tested != os.environ['GITHUB_SHA']:
            raise SystemExit('checkout differs from tested commit')
        if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
            commit = subprocess.check_output(['git', 'cat-file', '-p', 'HEAD'], text=True)
            parents = [line.split()[1] for line in commit.splitlines() if line.startswith('parent ')]
            if parents != [os.environ['PR_BASE_SHA'], os.environ['PR_HEAD_SHA']]:
                raise SystemExit('not the expected PR plus current-base merge')
        PY
    - name: Validate selection and select suites
      id: select
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        python3 -B -m unittest discover -s .github/scripts -p test_select_ci.py
        python3 .github/scripts/select-ci.py
  scan:
    needs: select
    uses: ./.github/workflows/scan.yaml
  workflow-lint:
    needs: select
    if: needs.select.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Lint workflows
      run: |
        curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
        printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
        "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
  go:
    needs: select
    if: needs.select.outputs.go == 'true'
    uses: ./.github/workflows/go.yaml
    with:
      shards: ${{ needs.select.outputs.go_shards }}
      server: ${{ needs.select.outputs.server == 'true' }}
      authkit_adapter: ${{ needs.select.outputs.authkit_adapter == 'true' }}
      openrails_adapter: ${{ needs.select.outputs.openrails_adapter == 'true' }}
  media-image:
    needs: select
    if: needs.select.outputs.media_image == 'true'
    uses: ./.github/workflows/media-image.yaml
  media-video:
    needs: select
    if: needs.select.outputs.media_video == 'true'
    uses: ./.github/workflows/media-video.yaml
  sdk-ui:
    needs: select
    if: needs.select.outputs.ui == 'true'
    uses: ./.github/workflows/sdk-ui.yaml
    with:
      unit: ${{ needs.select.outputs.ui_unit == 'true' }}
      browser: ${{ needs.select.outputs.ui_browser == 'true' }}
  image-definitions:
    needs: select
    if: needs.select.outputs.images == 'true'
    uses: ./.github/workflows/images.yaml
    permissions:
      contents: read
      packages: write
    with:
      verify_only: true
  gate:
    name: ${{ github.event.pull_request.draft && 'Draft PR (CI not requested)' || 'CI Gate' }}
    needs: [select, scan, workflow-lint, go, media-image, media-video, sdk-ui, image-definitions]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
    - env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        for result in $RESULTS; do
          [[ "$result" == success || "$result" == skipped ]] || exit 1
        done

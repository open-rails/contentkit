name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image ships both the `vector` and `pg_trgm` extensions the
        # integration tests self-provision.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: searchkit
          POSTGRES_PASSWORD: searchkit
          POSTGRES_DB: searchkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      clickhouse:
        # Drives the signal-plane and hub integration tests (event stream,
        # current-state reprojection, popular/recommend, dedup).
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_USER: searchkit
          CLICKHOUSE_PASSWORD: searchkit
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user searchkit --password searchkit --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      # Drive the env-gated integration tests. Without these they skip; with them
      # they run against the services above (Postgres: client/eval; ClickHouse +
      # Postgres: signal/hub).
      SEARCHKIT_TEST_URL: postgres://searchkit:searchkit@localhost:5432/searchkit_test?sslmode=disable
      SEARCHKIT_TEST_CH_ADDR: localhost:9000
      SEARCHKIT_TEST_CH_USER: searchkit
      SEARCHKIT_TEST_CH_PASSWORD: searchkit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1 -race

  keyword_profiles:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_USER: searchkit
          POSTGRES_PASSWORD: searchkit
          POSTGRES_DB: searchkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SEARCHKIT_PROFILE_URL: postgres://searchkit:searchkit@localhost:5432/searchkit_test?sslmode=disable
      SEARCHKIT_PGROONGA_URL: postgres://searchkit:searchkit@localhost:5432/searchkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install optional vector package for existing-profile qualification
        run: >-
          docker exec '${{ job.services.postgres.id }}' bash -c
          'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-18-pgvector'
      - name: Test fresh keyword and existing combined profiles and PGroonga discovery
        run: go test ./... -race -count=1 -run 'KeywordProfileIntegration|PGroonga'

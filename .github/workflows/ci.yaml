name: CI
# Source validation runs only on ready PRs into delivery branches or explicit dispatch.
'on':
  pull_request:
    branches: [master, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.draft && format('draft-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Verify candidate source
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.artifacts.outputs.images }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
    - name: Verify tested merge
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        python3 - <<'PY'
        import os, subprocess
        tested = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        if tested != os.environ['GITHUB_SHA']:
            raise SystemExit('checkout differs from tested commit')
        if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
            commit = subprocess.check_output(['git', 'cat-file', '-p', 'HEAD'], text=True)
            parents = [line.split()[1] for line in commit.splitlines() if line.startswith('parent ')]
            if parents != [os.environ['PR_BASE_SHA'], os.environ['PR_HEAD_SHA']]:
                raise SystemExit('not the expected PR plus current-base merge')
            ref = 'refs/heads/' + os.environ['PR_BASE_REF']
            subprocess.run(['git', 'check-ref-format', ref], check=True)
            current = subprocess.check_output(['git', 'ls-remote', '--exit-code', 'origin', ref], text=True).split()[0]
            if current != os.environ['PR_BASE_SHA']:
                raise SystemExit('base advanced; update the PR and rerun')
        PY
    - name: Lint workflows
      run: |
        curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
        printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
        "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
    - name: Select image-definition smoke
      id: artifacts
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        python3 - <<'PY_ARTIFACTS'
        import os, subprocess
        base = os.environ.get('PR_BASE_SHA')
        changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines() if base else []
        selected = not base or any(path.endswith('Dockerfile') or path in ('.dockerignore', '.github/workflows/images.yaml') for path in changed)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write('images=' + str(selected).lower() + '\n')
        PY_ARTIFACTS
  scan:
    needs: source
    uses: ./.github/workflows/scan.yaml
  critical:
    needs: source
    uses: ./.github/workflows/go.yaml
  sdk-ui:
    needs: source
    uses: ./.github/workflows/sdk-ui.yaml
  image-definitions:
    needs: source
    if: needs.source.outputs.images == 'true'
    uses: ./.github/workflows/images.yaml
    permissions:
      contents: read
      packages: write
    with:
      verify_only: true
  gate:
    name: ${{ github.event.pull_request.draft && 'Draft PR (CI not requested)' || 'CI Gate' }}
    needs: [source, scan, critical, sdk-ui, image-definitions]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
    - name: Require every selected contract and artifact check
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY_CHECK'
        import json, os
        jobs = json.loads(os.environ['NEEDS'])
        for name in ('source', 'scan', 'critical', 'sdk-ui'):
            if jobs[name]['result'] != 'success':
                raise SystemExit(f"required {name} did not pass: {jobs[name]['result']}")
        selected = jobs['source']['outputs'].get('images')
        if selected not in ('true', 'false'):
            raise SystemExit('missing artifact selection')
        result = jobs['image-definitions']['result']
        if selected == 'true' and result != 'success' or selected == 'false' and result not in ('success', 'skipped'):
            raise SystemExit(f'image-definition smoke did not satisfy selection: {result}')
        PY_CHECK
    - name: Require the tested base to remain current
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_REF" --jq .sha)"
        [[ "$current" == "$BASE_SHA" ]] || { echo 'Base advanced; update the PR and rerun.' >&2; exit 1; }

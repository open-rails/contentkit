name: ci
'on':
  push:
    branches:
    - '**'
  pull_request: {}
  workflow_dispatch: {}
jobs:
  injection-scan:
    if: github.event_name != 'push'
    uses: open-rails/helpers/.github/workflows/injection-scan.yml@6201c38329794f36e6b0cc19d850c4c4125451d5
  build:
    name: Build + Vet
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: |
        go build ./...
        go vet ./...
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_USER: contentkit
          POSTGRES_PASSWORD: contentkit
          POSTGRES_DB: contentkit_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U contentkit" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      CONTENTKIT_TEST_URL: postgres://contentkit:contentkit@localhost:5432/contentkit_test?sslmode=disable
      CONTENTKIT_PROFILE_URL: postgres://contentkit:contentkit@localhost:5432/contentkit_profiles?sslmode=disable
      CONTENTKIT_TEST_CH_ADDR: localhost:9000
      CONTENTKIT_TEST_CH_USER: contentkit
      CONTENTKIT_TEST_CH_PASSWORD: contentkit
      CONTENTKIT_TEST_CH_CLUSTER: contentkit
      CONTENTKIT_TEST_S3_ENDPOINT: http://localhost:9100
      CONTENTKIT_TEST_S3_ACCESS_KEY: contentkit
      CONTENTKIT_TEST_S3_SECRET_KEY: contentkit-secret
      CONTENTKIT_TEST_S3_REQUIRE: conditional,checksum
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Start ClickHouse with Keeper
      run: |
        docker run -d --name clickhouse -p 9000:9000 \
          -e CLICKHOUSE_USER=contentkit -e CLICKHOUSE_PASSWORD=contentkit -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
          -v "$GITHUB_WORKSPACE/.github/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro" \
          clickhouse/clickhouse-server:25.8
        for i in $(seq 1 60); do
          docker exec clickhouse clickhouse-client --user contentkit --password contentkit -q "SELECT count() FROM system.zookeeper WHERE path = '/'" && exit 0
          sleep 2
        done
        docker logs clickhouse
        exit 1
    - name: Start MinIO
      run: |
        docker run -d --name minio -p 9100:9000 \
          -e MINIO_ROOT_USER=contentkit -e MINIO_ROOT_PASSWORD=contentkit-secret \
          quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
        for i in $(seq 1 30); do
          curl -fsS http://localhost:9100/minio/health/ready && exit 0
          sleep 1
        done
        docker logs minio
        exit 1
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Isolate profile test databases
      run: docker exec '${{ job.services.postgres.id }}' createdb -U contentkit contentkit_profiles
    - name: build
      run: go build ./...
    - name: vet
      run: go vet ./...
    - name: test
      run: go test ./... -count=1 -race -p 2
    if: github.event_name != 'push'
    timeout-minutes: 25
  sdk-upload:
    name: Upload SDK
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/upload
    env:
      CONTENTKIT_TEST_S3_ENDPOINT: http://localhost:9100
      CONTENTKIT_TEST_S3_ACCESS_KEY: contentkit
      CONTENTKIT_TEST_S3_SECRET_KEY: contentkit-secret
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: sdk/upload/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: sdk/upload/pnpm-lock.yaml
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Start MinIO
      run: |
        docker run -d --name minio -p 9100:9000 \
          -e MINIO_ROOT_USER=contentkit -e MINIO_ROOT_PASSWORD=contentkit-secret \
          quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
        for i in $(seq 1 30); do
          curl -fsS http://localhost:9100/minio/health/ready && exit 0
          sleep 1
        done
        docker logs minio
        exit 1
    - run: pnpm install --frozen-lockfile
    - run: pnpm typecheck
    - run: pnpm test
    - run: pnpm build
    - name: integration (MinIO + media.UploadHandler)
      run: pnpm test:integration
  media-video:
    name: media/video (ffmpeg)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: contentkit
          POSTGRES_PASSWORD: contentkit
          POSTGRES_DB: contentkit_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U contentkit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTENTKIT_TEST_URL: postgres://contentkit:contentkit@localhost:5432/contentkit_test?sslmode=disable
      CONTENTKIT_TEST_S3_ENDPOINT: http://localhost:9100
      CONTENTKIT_TEST_S3_ACCESS_KEY: contentkit
      CONTENTKIT_TEST_S3_SECRET_KEY: contentkit-secret
      CONTENTKIT_TEST_S3_REQUIRE: conditional,checksum
      CONTENTKIT_TEST_FFMPEG: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version | head -1
    - name: Start MinIO
      run: |
        docker run -d --name minio -p 9100:9000 \
          -e MINIO_ROOT_USER=contentkit -e MINIO_ROOT_PASSWORD=contentkit-secret \
          quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
        for i in $(seq 1 30); do
          curl -fsS http://localhost:9100/minio/health/ready && exit 0
          sleep 1
        done
        docker logs minio
        exit 1
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: test
      run: go test ./media/video/... ./cmd/media-worker/... -count=1 -race -p 2 -v
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Keyword retrieval requires PGroonga; install vector for optional semantic tests.
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_USER: searchkit
          POSTGRES_PASSWORD: searchkit
          POSTGRES_DB: searchkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Drive the env-gated integration tests. Without these they skip; with them
      # they run against the services above (Postgres: client/eval; ClickHouse +
      # Postgres: signal/hub).
      SEARCHKIT_TEST_URL: postgres://searchkit:searchkit@localhost:5432/searchkit_test?sslmode=disable
      SEARCHKIT_TEST_CH_ADDR: localhost:9000
      SEARCHKIT_TEST_CH_USER: searchkit
      SEARCHKIT_TEST_CH_PASSWORD: searchkit
      SEARCHKIT_TEST_CH_CLUSTER: searchkit

    steps:
      - uses: actions/checkout@v4

      # Signal-plane migrations use replicated engines, so ClickHouse runs with
      # embedded Keeper and a one-node cluster (config needs the checkout).
      - name: Start ClickHouse with Keeper
        run: |
          docker run -d --name clickhouse -p 9000:9000 \
            -e CLICKHOUSE_USER=searchkit -e CLICKHOUSE_PASSWORD=searchkit -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -v "$GITHUB_WORKSPACE/.github/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro" \
            clickhouse/clickhouse-server:25.8
          for i in $(seq 1 60); do
            docker exec clickhouse clickhouse-client --user searchkit --password searchkit -q "SELECT count() FROM system.zookeeper WHERE path = '/'" && exit 0
            sleep 2
          done
          docker logs clickhouse
          exit 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install vector for combined-profile tests
        run: >-
          docker exec '${{ job.services.postgres.id }}' bash -c
          'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-18-pgvector'

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1 -race

  keyword_profiles:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_USER: searchkit
          POSTGRES_PASSWORD: searchkit
          POSTGRES_DB: searchkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SEARCHKIT_PROFILE_URL: postgres://searchkit:searchkit@localhost:5432/searchkit_test?sslmode=disable
      SEARCHKIT_PGROONGA_URL: postgres://searchkit:searchkit@localhost:5432/searchkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install optional vector package for existing-profile qualification
        run: >-
          docker exec '${{ job.services.postgres.id }}' bash -c
          'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-18-pgvector'
      - name: Test fresh keyword and existing combined profiles and PGroonga discovery
        run: go test ./... -race -count=1 -run 'KeywordProfileIntegration|KeywordNativeIntegration|PGroonga'

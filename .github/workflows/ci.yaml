name: CI
# Source validation runs only on ready PRs into delivery branches or explicit dispatch.
'on':
  pull_request:
    branches: [master, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed' && format('draft-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Verify candidate source
    if: github.event.pull_request.draft != true && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.areas.outputs.images }}
      critical: ${{ steps.areas.outputs.critical }}
      suite: ${{ steps.areas.outputs.suite }}
      scan: ${{ steps.areas.outputs.scan }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
    - name: Verify tested merge
      env:
        GH_TOKEN: ${{ github.token }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        python3 - <<'PY'
        import os, subprocess
        from urllib.parse import quote
        tested = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        if tested != os.environ['GITHUB_SHA']:
            raise SystemExit('checkout differs from tested commit')
        if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
            commit = subprocess.check_output(['git', 'cat-file', '-p', 'HEAD'], text=True)
            parents = [line.split()[1] for line in commit.splitlines() if line.startswith('parent ')]
            if parents != [os.environ['PR_BASE_SHA'], os.environ['PR_HEAD_SHA']]:
                raise SystemExit('not the expected PR plus current-base merge')
            ref = 'refs/heads/' + os.environ['PR_BASE_REF']
            subprocess.run(['git', 'check-ref-format', ref], check=True)
            endpoint = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/' + quote(os.environ['PR_BASE_REF'], safe='/')
            current = subprocess.check_output(['gh', 'api', endpoint, '--jq', '.object.sha'], text=True).strip()
            if current != os.environ['PR_BASE_SHA']:
                raise SystemExit('base advanced; update the PR and rerun')
        PY
    - name: Lint workflows
      run: |
        curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
        printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
        "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
    - name: Select affected checks conservatively
      id: areas
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        python3 .github/scripts/check-ci-policy.py
        if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
          python3 .github/scripts/ci-scope.py --base "$PR_BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/selected-checks.json"
        else
          python3 .github/scripts/ci-scope.py --full --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/selected-checks.json"
        fi
        cat "$RUNNER_TEMP/selected-checks.json" >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: source
    if: needs.source.outputs.scan == 'true'
    uses: ./.github/workflows/scan.yaml
  critical:
    needs: source
    if: needs.source.outputs.critical == 'true'
    uses: ./.github/workflows/go.yaml
    with:
      suite: ${{ needs.source.outputs.suite }}
  image-definitions:
    needs: source
    if: needs.source.outputs.images == 'true'
    uses: ./.github/workflows/images.yaml
    permissions:
      contents: read
      packages: write
    with:
      verify_only: true
  gate:
    name: ${{ (github.event.pull_request.draft || github.event.action == 'closed') && 'Inactive PR (CI not requested)' || 'CI Gate' }}
    needs: [source, scan, critical, image-definitions]
    if: always() && github.event.pull_request.draft != true && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
    - name: Require every selected contract and artifact check
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY_CHECK'
        import json, os
        jobs = json.loads(os.environ['NEEDS'])
        if jobs['source']['result'] != 'success':
            raise SystemExit('source verification did not pass')
        plan = jobs['source']['outputs']
        for name, area in [('scan', 'scan'), ('critical', 'critical'), ('image-definitions', 'images')]:
            selected = plan.get(area)
            if selected not in ('true', 'false'):
                raise SystemExit(f'missing selection for {area}')
            expected = 'success' if selected == 'true' else 'skipped'
            if jobs[name]['result'] != expected:
                raise SystemExit(f"{name}: {jobs[name]['result']}; expected {expected}")
        PY_CHECK
    - name: Require the tested base to remain current
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_REF" --jq .sha)"
        [[ "$current" == "$BASE_SHA" ]] || { echo 'Base advanced; update the PR and rerun.' >&2; exit 1; }

name: ci
'on':
  push:
    branches:
    - '**'
  pull_request: {}
  workflow_dispatch: {}
jobs:
  injection-scan:
    name: Injected Code Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Scan tracked files
      run: ./scripts/scan-injected-code.sh --all
    - name: Detector self-test
      run: ./scripts/scan-injected-code.sh --self-test
    if: github.event_name != 'push'
  build:
    name: Build + Vet
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: |
        go build ./...
        go vet ./...
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_USER: searchkit
          POSTGRES_PASSWORD: searchkit
          POSTGRES_DB: searchkit_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U searchkit" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      SEARCHKIT_TEST_URL: postgres://searchkit:searchkit@localhost:5432/searchkit_test?sslmode=disable
      SEARCHKIT_TEST_CH_ADDR: localhost:9000
      SEARCHKIT_TEST_CH_USER: searchkit
      SEARCHKIT_TEST_CH_PASSWORD: searchkit
      SEARCHKIT_TEST_CH_CLUSTER: searchkit
      SEARCHKIT_PROFILE_URL: postgres://searchkit:searchkit@localhost:5432/searchkit_profiles?sslmode=disable
      SEARCHKIT_PGROONGA_URL: postgres://searchkit:searchkit@localhost:5432/searchkit_native?sslmode=disable
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Start ClickHouse with Keeper
      run: |
        docker run -d --name clickhouse -p 9000:9000 \
          -e CLICKHOUSE_USER=searchkit -e CLICKHOUSE_PASSWORD=searchkit -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
          -v "$GITHUB_WORKSPACE/.github/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro" \
          clickhouse/clickhouse-server:25.8
        for i in $(seq 1 60); do
          docker exec clickhouse clickhouse-client --user searchkit --password searchkit -q "SELECT count() FROM system.zookeeper WHERE path = '/'" && exit 0
          sleep 2
        done
        docker logs clickhouse
        exit 1
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Install vector for combined-profile tests
      run: docker exec '${{ job.services.postgres.id }}' bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-18-pgvector'
    - name: Isolate keyword test databases
      run: |
        docker exec '${{ job.services.postgres.id }}' createdb -U searchkit searchkit_profiles
        docker exec '${{ job.services.postgres.id }}' createdb -U searchkit searchkit_native
    - name: build
      run: go build ./...
    - name: vet
      run: go vet ./...
    - name: test
      run: go test ./... -count=1 -race
    if: github.event_name != 'push'
    timeout-minutes: 20
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

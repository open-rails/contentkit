name: Critical public contracts
'on':
  workflow_call:
    inputs:
      suite:
        type: string
        default: all
permissions:
  contents: read
jobs:
  critical:
    name: Critical backend and browser
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    # The worker's build image: libvips and FFmpeg come from the worker's Debian
    # snapshot. PostgreSQL and ClickHouse are reached by name on the job's
    # network; MinIO shares this container's network, so browsers reach storage
    # on localhost, which they trust as they trust an HTTPS endpoint. The
    # runner's Docker socket is mounted in.
    container:
      image: golang:1.26.11-trixie@sha256:cff05dd6b81c901f2e8249eb6f91c69a60451d0f12c26bfef08e476a85b32d4d
    # A container job's run steps default to sh; the scripts are bash.
    defaults:
      run:
        shell: bash
    # Leave room for cold race compilation and artifact collection around the
    # suite's own bounded Go test timeout.
    timeout-minutes: 60
    services:
      postgres:
        image: groonga/pgroonga@sha256:55f246f1137e194d830ffac88a22f4d3e8023bcebb3bc0b36eb8732e322c9dc2 # 4.1.0-debian-18
        env:
          POSTGRES_USER: contentkit
          POSTGRES_PASSWORD: contentkit
          POSTGRES_DB: critical
        options: --health-cmd "pg_isready -U contentkit" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
      DEBIAN_FRONTEND: noninteractive
      CONTENTKIT_CRITICAL_PG: postgres://contentkit:contentkit@postgres:5432/critical?sslmode=disable
      CONTENTKIT_CRITICAL_S3_ENDPOINT: http://localhost:9000
      CONTENTKIT_CRITICAL_S3_USER: contentkit
      CONTENTKIT_CRITICAL_S3_PASSWORD: contentkit-secret
      CONTENTKIT_CRITICAL_CH_ADDR: critical-clickhouse:9000
      CONTENTKIT_CRITICAL_CH_USER: contentkit
      CONTENTKIT_CRITICAL_CH_PASSWORD: contentkit
      CONTENTKIT_CRITICAL_CH_CLUSTER: contentkit
      CONTENTKIT_CRITICAL_CH_TLS_ADDR: critical-clickhouse:9440
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    # FFmpeg 7.1 with SVT-AV1 and the dav1d HEIF plugin, as the worker image ships.
    - uses: ./.github/actions/native-setup
      with:
        packages: libvips-dev libheif-plugin-dav1d ffmpeg python3 openssl docker-cli
    - name: Issue the signal store's test TLS certificate
      run: |
        dir="$RUNNER_TEMP/clickhouse-tls"
        mkdir -p "$dir" && cd "$dir"
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=contentkit critical CA" -keyout ca.key -out ca.crt
        openssl req -newkey rsa:2048 -nodes -subj "/CN=critical-clickhouse" -keyout server.key -out server.csr
        printf 'subjectAltName=DNS:critical-clickhouse\n' > san.ext
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 -extfile san.ext -out server.crt
        chmod 644 server.key
        echo "CONTENTKIT_CRITICAL_CH_TLS_DIR=$dir" >> "$GITHUB_ENV"
        echo "CONTENTKIT_CRITICAL_CH_CA_FILE=$dir/ca.crt" >> "$GITHUB_ENV"
    - name: Start shared object and signal stores
      env:
        JOB_CONTAINER: ${{ job.container.id }}
        NETWORK: ${{ job.container.network }}
      run: |
        docker run -d --name critical-minio --network "container:$JOB_CONTAINER" \
          -e MINIO_ROOT_USER=contentkit -e MINIO_ROOT_PASSWORD=contentkit-secret \
          cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
        # The daemon cannot bind-mount this container's paths; copy the config in.
        docker create --name critical-clickhouse --network "$NETWORK" \
          -e CLICKHOUSE_USER=contentkit -e CLICKHOUSE_PASSWORD=contentkit -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
          clickhouse/clickhouse-server@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77 # 25.8
        docker cp .github/clickhouse/keeper.xml critical-clickhouse:/etc/clickhouse-server/config.d/keeper.xml
        docker cp .github/clickhouse/tls.xml critical-clickhouse:/etc/clickhouse-server/config.d/tls.xml
        docker cp "$CONTENTKIT_CRITICAL_CH_TLS_DIR" critical-clickhouse:/etc/clickhouse-server/tls
        docker start critical-clickhouse
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:9000/minio/health/ready >/dev/null &&
            docker exec critical-clickhouse clickhouse-client --user contentkit --password contentkit -q "SELECT count() FROM system.zookeeper WHERE path = '/'"; then exit 0; fi
          sleep 1
        done
        docker logs critical-minio
        docker logs critical-clickhouse
        exit 1
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        package_json_file: sdk/ui/package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: sdk/ui/pnpm-lock.yaml
    - name: Build the shipped SDK and real browser harness
      working-directory: sdk/ui
      run: |
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm contract:check
        pnpm typecheck && pnpm lint && pnpm test:read-refresh && pnpm test:activity && pnpm build
        pnpm pack --pack-destination "$RUNNER_TEMP"
        python3 ../../.github/scripts/check-npm-package.py "$RUNNER_TEMP/openrails-contentkit-ui-0.0.0.tgz" 0.0.0
        # These three are independent (two configs write to two different
        # outDirs, the Playwright install touches neither).
        declare -A browser_pids
        mkdir -p "$RUNNER_TEMP/browser-build-logs"
        ( pnpm exec vite build --config ../../tests/critical/browser/vite.config.mjs ) \
          > "$RUNNER_TEMP/browser-build-logs/vite.log" 2>&1 &
        browser_pids[vite]=$!
        ( RAYON_NUM_THREADS=1 pnpm exec vite build --config ../../tests/critical/browser/media-sse-upload.config.mjs ) \
          > "$RUNNER_TEMP/browser-build-logs/media-sse-upload.log" 2>&1 &
        browser_pids[media-sse-upload]=$!
        ( pnpm exec playwright install --with-deps chromium ) \
          > "$RUNNER_TEMP/browser-build-logs/playwright-install.log" 2>&1 &
        browser_pids[playwright-install]=$!
        status=0
        for name in "${!browser_pids[@]}"; do
          if wait "${browser_pids[$name]}"; then
            echo "::group::$name (ok)"
          else
            echo "::group::$name (FAILED)"
            status=1
          fi
          cat "$RUNNER_TEMP/browser-build-logs/$name.log"
          echo "::endgroup::"
        done
        [[ $status -eq 0 ]] || exit 1
    - name: Build and vet public modules and native commands
      run: bash .github/scripts/build-and-vet.sh
    - name: Video command lines and HDR filter graphs against FFmpeg
      run: go test -count=1 -p 1 ./internal/media/video
    - name: Run every reviewed critical contract with race detection
      env:
        CRITICAL_SUITE: ${{ inputs.suite }}
      run: python3 tests/critical/run.py --race --suite "$CRITICAL_SUITE"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: contentkit-critical-results
        path: tests/critical/results/
        if-no-files-found: error
        retention-days: 7
    - name: Stop only this job's stores
      if: always()
      run: docker rm -f critical-minio critical-clickhouse

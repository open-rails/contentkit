name: Critical public contracts
'on':
  workflow_call:
    inputs:
      suite:
        type: string
        default: all
permissions:
  contents: read
jobs:
  critical:
    name: Critical backend and browser
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    # Leave room for cold race compilation and artifact collection around the
    # suite's own bounded Go test timeout.
    timeout-minutes: 60
    services:
      postgres:
        image: groonga/pgroonga:4.1.0-debian-18
        env:
          POSTGRES_USER: contentkit
          POSTGRES_PASSWORD: contentkit
          POSTGRES_DB: critical
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U contentkit" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
      CONTENTKIT_CRITICAL_PG: postgres://contentkit:contentkit@localhost:5432/critical?sslmode=disable
      CONTENTKIT_CRITICAL_S3_ENDPOINT: http://localhost:9100
      CONTENTKIT_CRITICAL_S3_USER: contentkit
      CONTENTKIT_CRITICAL_S3_PASSWORD: contentkit-secret
      CONTENTKIT_CRITICAL_CH_ADDR: localhost:9000
      CONTENTKIT_CRITICAL_CH_USER: contentkit
      CONTENTKIT_CRITICAL_CH_PASSWORD: contentkit
      CONTENTKIT_CRITICAL_CH_CLUSTER: contentkit
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version-file: tests/critical/go.mod
        cache-dependency-path: |
          go.sum
          tests/critical/go.sum
          server/go.sum
          adapters/authkit/go.sum
          adapters/openrails/go.sum
    - name: Start shared object and signal stores
      run: |
        docker run -d --name critical-minio -p 9100:9000 \
          -e MINIO_ROOT_USER=contentkit -e MINIO_ROOT_PASSWORD=contentkit-secret \
          cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
        docker run -d --name critical-clickhouse -p 9000:9000 \
          -e CLICKHOUSE_USER=contentkit -e CLICKHOUSE_PASSWORD=contentkit -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
          -v "$GITHUB_WORKSPACE/.github/clickhouse/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro" \
          clickhouse/clickhouse-server:25.8
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:9100/minio/health/ready >/dev/null &&
            docker exec critical-clickhouse clickhouse-client --user contentkit --password contentkit -q "SELECT count() FROM system.zookeeper WHERE path = '/'"; then exit 0; fi
          sleep 1
        done
        docker logs critical-minio
        docker logs critical-clickhouse
        exit 1
    - name: Install native processing dependencies
      run: $GITHUB_WORKSPACE/.github/scripts/apt-install.sh libvips-dev
    - name: Start the media worker's FFmpeg runtime
      run: bash .github/scripts/critical-media-tools.sh start
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: sdk/ui/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: sdk/ui/pnpm-lock.yaml
    - name: Build the shipped SDK and real browser harness
      working-directory: sdk/ui
      run: |
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm contract:check
        pnpm typecheck && pnpm lint && pnpm test:read-refresh && pnpm build
        pnpm pack --pack-destination "$RUNNER_TEMP"
        python3 ../../.github/scripts/check-npm-package.py "$RUNNER_TEMP/openrails-contentkit-ui-0.0.0.tgz" 0.0.0
        # These four are independent (three configs write to three different
        # outDirs, the Playwright install touches neither) -- were running
        # one after another for no reason.
        declare -A browser_pids
        mkdir -p "$RUNNER_TEMP/browser-build-logs"
        ( pnpm exec vite build --config ../../tests/critical/browser/vite.config.mjs ) \
          > "$RUNNER_TEMP/browser-build-logs/vite.log" 2>&1 &
        browser_pids[vite]=$!
        ( RAYON_NUM_THREADS=1 pnpm exec vite build --config ../../tests/critical/browser/search-attribution.config.mjs ) \
          > "$RUNNER_TEMP/browser-build-logs/search-attribution.log" 2>&1 &
        browser_pids[search-attribution]=$!
        ( RAYON_NUM_THREADS=1 pnpm exec vite build --config ../../tests/critical/browser/media-sse-upload.config.mjs ) \
          > "$RUNNER_TEMP/browser-build-logs/media-sse-upload.log" 2>&1 &
        browser_pids[media-sse-upload]=$!
        ( pnpm exec playwright install --with-deps chromium ) \
          > "$RUNNER_TEMP/browser-build-logs/playwright-install.log" 2>&1 &
        browser_pids[playwright-install]=$!
        status=0
        for name in "${!browser_pids[@]}"; do
          if wait "${browser_pids[$name]}"; then
            echo "::group::$name (ok)"
          else
            echo "::group::$name (FAILED)"
            status=1
          fi
          cat "$RUNNER_TEMP/browser-build-logs/$name.log"
          echo "::endgroup::"
        done
        [[ $status -eq 0 ]] || exit 1
    - name: Build and vet public modules and native commands
      run: |
        # The modules (the last is the `pnpm demo` harness) are independent of
        # each other, so they build and vet concurrently instead of one after
        # another. Each still runs its own compile with -p 1, left alone --
        # untangling that pairs with the merge-queue work, not this change.
        declare -A module_pids
        mkdir -p "$RUNNER_TEMP/module-build-logs"
        for module in . adapters/authkit adapters/openrails sdk/ui/e2e/server; do
          log="$RUNNER_TEMP/module-build-logs/$(echo "$module" | tr '/.' '__').log"
          (cd "$module" && go build -p 1 ./... && go vet -p 1 ./...) > "$log" 2>&1 &
          module_pids["$module"]=$!
        done
        status=0
        for module in "${!module_pids[@]}"; do
          log="$RUNNER_TEMP/module-build-logs/$(echo "$module" | tr '/.' '__').log"
          if wait "${module_pids[$module]}"; then
            echo "::group::build/vet $module (ok)"
          else
            echo "::group::build/vet $module (FAILED)"
            status=1
          fi
          cat "$log"
          echo "::endgroup::"
        done
        [[ $status -eq 0 ]] || exit 1
        CGO_ENABLED=1 go build -p 1 -o tests/critical/.bin/media-worker ./cmd/media-worker
        # Hosts, server/ and adapters/* reach only the public surface.
        go test -count=1 -p 1 ./internal/boundaries
        # The published server module has no local replacements. Qualify this
        # checkout before its paired root/adapter tags exist, just as Docker does.
        server_mod="$RUNNER_TEMP/contentkit-server.mod"
        cp server/go.mod "$server_mod"
        cp server/go.sum "${server_mod%.mod}.sum"
        (
          cd server
          go mod edit -modfile="$server_mod" \
            -replace=github.com/open-rails/contentkit="$GITHUB_WORKSPACE" \
            -replace=github.com/open-rails/contentkit/adapters/openrails="$GITHUB_WORKSPACE/adapters/openrails" \
            -replace=github.com/open-rails/contentkit/adapters/authkit="$GITHUB_WORKSPACE/adapters/authkit"
          go build -mod=readonly -modfile="$server_mod" -p 1 ./...
          go vet -mod=readonly -modfile="$server_mod" -p 1 ./...
        )
        test -z "$(gofmt -l tests/critical)"
        (cd tests/critical && go mod tidy -diff && go vet -p 1 ./...)
    - name: Run every reviewed critical contract with race detection
      env:
        CRITICAL_SUITE: ${{ inputs.suite }}
      run: python3 tests/critical/run.py --race --suite "$CRITICAL_SUITE"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: contentkit-critical-results
        path: tests/critical/results/
        if-no-files-found: error
        retention-days: 7
    - name: Stop only this job's stores
      if: always()
      run: docker rm -f critical-minio critical-clickhouse
    - name: Stop only this job's media tools
      if: always()
      run: bash .github/scripts/critical-media-tools.sh stop

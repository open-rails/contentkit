name: verify-images
# Builds every image definition for linux/amd64 without credentials or
# pushing. Release tags publish through images.yaml.
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }} (verify)
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - {name: media-gateway, file: cmd/media-gateway/Dockerfile}
        - {name: media-worker, file: cmd/media-worker/Dockerfile}
        - {name: server, file: server/cmd/contentkit/Dockerfile}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        file: ${{ matrix.file }}
        platforms: linux/amd64
        outputs: type=cacheonly
        cache-from: type=gha,scope=${{ matrix.name }}-amd64

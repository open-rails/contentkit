name: verify-images
# Builds every image definition for linux/amd64 without credentials or
# pushing, and scans it as images.yaml scans what it publishes. Release tags
# publish through images.yaml.
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }} (verify)
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - {name: media-gateway, file: cmd/media-gateway/Dockerfile}
        - {name: media-worker, file: cmd/media-worker/Dockerfile}
        - {name: server, file: server/cmd/contentkit/Dockerfile}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        driver-opts: image=moby/buildkit@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c # buildx-stable-1
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        file: ${{ matrix.file }}
        platforms: linux/amd64
        outputs: type=docker,name=contentkit-${{ matrix.name }}:verify
        cache-from: type=gha,scope=${{ matrix.name }}-amd64
    - name: Refuse fixable HIGH and CRITICAL vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: contentkit-${{ matrix.name }}:verify
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'

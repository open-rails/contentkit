name: sdk-release
'on':
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the package to (e.g. v0.17.0)
        required: true
permissions:
  contents: write
jobs:
  package:
    name: Attach @openrails/contentkit-upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: sdk/upload
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
        persist-credentials: false
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: sdk/upload/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm check
    - name: Version from tag
      run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
    - name: Build release archive
      run: |
        mkdir release
        pnpm pack --pack-destination release
        ls "release/openrails-contentkit-upload-${TAG#v}.tgz"
    - name: Upload release asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$TAG" release/*.tgz --clobber --repo "$GITHUB_REPOSITORY"

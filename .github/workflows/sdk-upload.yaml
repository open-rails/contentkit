name: sdk-upload
'on':
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
    - 'sdk/upload/**'
    - 'media/*.go'
    - 'media/internal/**'
    - 'media/layout/**'
    - 'media/s3/**'
    - 'media/token/**'
    - '!**.md'
    - 'go.mod'
    - 'go.sum'
    - '.github/workflows/sdk-upload.yaml'
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: sdk-upload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sdk-upload:
    name: Upload SDK
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/upload
    env:
      CONTENTKIT_TEST_S3_ENDPOINT: http://localhost:9100
      CONTENTKIT_TEST_S3_ACCESS_KEY: contentkit
      CONTENTKIT_TEST_S3_SECRET_KEY: contentkit-secret
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Start MinIO
      run: |
        docker run -d --name minio -p 9100:9000 \
          -e MINIO_ROOT_USER=contentkit -e MINIO_ROOT_PASSWORD=contentkit-secret \
          cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: sdk/upload/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: sdk/upload/pnpm-lock.yaml
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm check
    - name: integration (MinIO + media.UploadHandler)
      run: |
        timeout 60 sh -c "until curl -fsS http://localhost:9100/minio/health/ready; do sleep 1; done"
        pnpm test:integration

name: images
# Release tags publish ghcr.io/open-rails/contentkit-{name}:{tag} and
# docker.io/openrails/contentkit-{name}:{tag} for linux/amd64 and linux/arm64,
# each built on a native runner (QEMU arm64 builds exceeded the timeout), then
# merged into one multi-arch tag. media-gateway/vX.Y.Z releases only that
# component as contentkit-media-gateway:gateway-vX.Y.Z, independently of root
# release image tags. Dispatched on a release tag, it republishes that tag.
# Registry credentials live in the release environment, which admits release
# tags only; pull requests build through verify-images.yaml.
'on':
  push:
    tags:
    - 'v*'
    - 'media-gateway/v*'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      names: ${{ steps.version.outputs.names }}
    steps:
    - name: Image version
      id: version
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        [[ "$REF_TYPE" == tag && "$REF_NAME" =~ ^(media-gateway/)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid image release tag'; exit 1; }
        if [[ "$REF_NAME" == media-gateway/* ]]; then
          echo "tag=gateway-${REF_NAME##*/}" >> "$GITHUB_OUTPUT"
          echo 'names=["media-gateway"]' >> "$GITHUB_OUTPUT"
        else
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo 'names=["media-gateway","media-worker","server"]' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Verify release source belongs to master
      run: git merge-base --is-ancestor HEAD origin/master
  build:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    needs: release
    environment: release
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.release.outputs.names) }}
        arch: [amd64, arm64]
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: rev
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: openrails
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        file: ${{ matrix.name == 'server' && 'server/cmd/contentkit/Dockerfile' || format('cmd/{0}/Dockerfile', matrix.name) }}
        platforms: linux/${{ matrix.arch }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          org.opencontainers.image.version=${{ env.TAG }}
        outputs: type=image,"name=ghcr.io/open-rails/contentkit-${{ matrix.name }},docker.io/openrails/contentkit-${{ matrix.name }}",push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
    - run: |
        mkdir -p digests
        touch "digests/${DIGEST#sha256:}"
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: digest-${{ matrix.name }}-${{ matrix.arch }}
        path: digests/*
        retention-days: 1
  publish:
    name: ${{ matrix.name }} (multi-arch)
    needs: [release, build]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.release.outputs.names) }}
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: digest-${{ matrix.name }}-*
        path: digests
        merge-multiple: true
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: openrails
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - working-directory: digests
      run: |
        test "$(ls | wc -l)" -eq 2
        for repo in ghcr.io/open-rails/contentkit-$NAME docker.io/openrails/contentkit-$NAME; do
          docker buildx imagetools create -t "$repo:$TAG" $(printf "$repo@sha256:%s " *)
          docker buildx imagetools inspect "$repo:$TAG"
        done
      env:
        NAME: ${{ matrix.name }}
        TAG: ${{ needs.release.outputs.tag }}

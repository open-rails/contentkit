name: images
# Release tags publish ghcr.io/open-rails/contentkit-{name}:{tag} and
# docker.io/openrails/contentkit-{name}:{tag}. Pull requests that touch image
# definitions build linux/amd64 only, without pushing.
'on':
  push:
    tags:
    - 'v*'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
    - 'cmd/*/Dockerfile'
    - '.dockerignore'
    - '.github/workflows/images.yaml'
permissions:
  contents: read
concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    name: ${{ matrix.name }}
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: media-access
          dockerfile: cmd/media-access/Dockerfile
        - name: media-worker
          dockerfile: cmd/media-worker/Dockerfile
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@v3
    - if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: openrails
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: ${{ github.event_name == 'push' }}
        tags: |
          ghcr.io/open-rails/contentkit-${{ matrix.name }}:${{ github.event_name == 'push' && github.ref_name || 'pr' }}
          docker.io/openrails/contentkit-${{ matrix.name }}:${{ github.event_name == 'push' && github.ref_name || 'pr' }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ github.ref_name }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

name: images
# Release tags publish ghcr.io/open-rails/contentkit-{name}:{tag} and
# docker.io/openrails/contentkit-{name}:{tag}; pull requests only build.
'on':
  push:
    tags:
    - 'v*'
  pull_request:
    paths:
    - 'cmd/**'
    - 'media/**'
    - 'go.mod'
    - 'go.sum'
    - '.dockerignore'
    - '.github/workflows/images.yaml'
permissions:
  contents: read
jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: media-access
          dockerfile: cmd/media-access/Dockerfile
        - name: media-worker
          dockerfile: cmd/media-worker/Dockerfile
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@v3
    - if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: openrails
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name == 'push' }}
        tags: |
          ghcr.io/open-rails/contentkit-${{ matrix.name }}:${{ github.event_name == 'push' && github.ref_name || 'pr' }}
          docker.io/openrails/contentkit-${{ matrix.name }}:${{ github.event_name == 'push' && github.ref_name || 'pr' }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ github.ref_name }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}

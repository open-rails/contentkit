name: images
# Release tags publish ghcr.io/open-rails/contentkit-{name}:{tag} and
# docker.io/openrails/contentkit-{name}:{tag} for linux/amd64 and linux/arm64,
# each built on a native runner (QEMU arm64 builds exceeded the timeout), then
# merged into one multi-arch tag. media-gateway/vX.Y.Z releases only that
# component as contentkit-media-gateway:gateway-vX.Y.Z, independently of root
# release image tags. Pull requests that touch image definitions
# build linux/amd64 only, without pushing. workflow_dispatch rebuilds a tag.
'on':
  push:
    tags:
    - 'v*'
    - 'media-gateway/v*'
  workflow_call:
    inputs:
      verify_only:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing root or media-gateway release tag to (re)publish
        required: true
permissions:
  contents: read
concurrency:
  group: images-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PUBLISH: ${{ !inputs.verify_only && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    if: '!github.event.pull_request.draft'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(startsWith(inputs.tag || github.ref_name, 'media-gateway/') && '["media-gateway"]' || '["media-gateway","media-worker","server"]') }}
        arch: ${{ fromJSON((inputs.verify_only || github.event_name == 'pull_request') && '["amd64"]' || '["amd64","arm64"]') }}
    steps:
    - name: Image version
      if: env.PUBLISH == 'true'
      run: |
        [[ "$TAG" =~ ^(media-gateway/)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid image release tag'; exit 1; }
        if [[ "$TAG" == media-gateway/* ]]; then TAG="gateway-${TAG##*/}"; fi
        echo "TAG=$TAG" >> "$GITHUB_ENV"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ inputs.tag || github.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Verify release source belongs to master
      if: env.PUBLISH == 'true'
      run: git merge-base --is-ancestor HEAD origin/master
    - id: rev
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - if: env.PUBLISH == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - if: env.PUBLISH == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: openrails
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        file: ${{ matrix.name == 'server' && 'server/cmd/contentkit/Dockerfile' || format('cmd/{0}/Dockerfile', matrix.name) }}
        platforms: linux/${{ matrix.arch }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          org.opencontainers.image.version=${{ env.TAG }}
        outputs: ${{ env.PUBLISH == 'true' && format('type=image,"name=ghcr.io/open-rails/contentkit-{0},docker.io/openrails/contentkit-{0}",push-by-digest=true,name-canonical=true,push=true', matrix.name) || 'type=cacheonly' }}
        cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
        cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,mode=max,scope={0}-{1}', matrix.name, matrix.arch) || '' }}
    - if: env.PUBLISH == 'true'
      run: |
        mkdir -p digests
        touch "digests/${DIGEST#sha256:}"
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
    - if: env.PUBLISH == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: digest-${{ matrix.name }}-${{ matrix.arch }}
        path: digests/*
        retention-days: 1
  publish:
    name: ${{ matrix.name }} (multi-arch)
    needs: build
    if: ${{ !inputs.verify_only && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(startsWith(inputs.tag || github.ref_name, 'media-gateway/') && '["media-gateway"]' || '["media-gateway","media-worker","server"]') }}
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: digest-${{ matrix.name }}-*
        path: digests
        merge-multiple: true
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: openrails
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - working-directory: digests
      run: |
        if [[ "$TAG" == media-gateway/* ]]; then TAG="gateway-${TAG##*/}"; fi
        test "$(ls | wc -l)" -eq 2
        for repo in ghcr.io/open-rails/contentkit-$NAME docker.io/openrails/contentkit-$NAME; do
          docker buildx imagetools create -t "$repo:$TAG" $(printf "$repo@sha256:%s " *)
          docker buildx imagetools inspect "$repo:$TAG"
        done
      env:
        NAME: ${{ matrix.name }}

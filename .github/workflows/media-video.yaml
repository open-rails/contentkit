name: media-video
'on':
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
    - 'media/**'
    - '!media/image/**'
    - '!**.md'
    - 'go.mod'
    - 'go.sum'
    - '.github/workflows/media-video.yaml'
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: media-video-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  media-video:
    name: media/video (ffmpeg)
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: contentkit
          POSTGRES_PASSWORD: contentkit
          POSTGRES_DB: contentkit_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U contentkit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTENTKIT_TEST_URL: postgres://contentkit:contentkit@localhost:5432/contentkit_test?sslmode=disable
      CONTENTKIT_TEST_S3_ENDPOINT: http://localhost:9100
      CONTENTKIT_TEST_S3_ACCESS_KEY: contentkit
      CONTENTKIT_TEST_S3_SECRET_KEY: contentkit-secret
      CONTENTKIT_TEST_S3_REQUIRE: conditional,checksum
      CONTENTKIT_TEST_FFMPEG: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Start MinIO
      run: |
        docker run -d --name minio -p 9100:9000 \
          -e MINIO_ROOT_USER=contentkit -e MINIO_ROOT_PASSWORD=contentkit-secret \
          cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
    - name: vet, test (Debian trixie's ffmpeg 7.1 with libx264, libx265 and libsvtav1, as in the media-worker image)
      run: |
        timeout 60 sh -c "until curl -fsS http://localhost:9100/minio/health/ready; do sleep 1; done"
        docker run --rm --network host -v "$PWD:/src" -w /src \
          -e CONTENTKIT_TEST_URL -e CONTENTKIT_TEST_S3_ENDPOINT -e CONTENTKIT_TEST_S3_ACCESS_KEY \
          -e CONTENTKIT_TEST_S3_SECRET_KEY -e CONTENTKIT_TEST_S3_REQUIRE -e CONTENTKIT_TEST_FFMPEG -e GOFLAGS=-buildvcs=false \
          golang:1.26.6-trixie sh -ec '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
            go vet ./media/video/...
            go test ./media/video/... -count=1 -race -p 2 -v'

name: generate-contract
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source commit, tag or branch to generate
        type: string
        required: true
        default: master
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Generate the API contract on the runner
      run: |
        go generate ./internal/contract
        git rev-parse HEAD > contract-head.txt
        git diff --stat
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: contentkit-contract-${{ github.run_id }}
        path: |
          contract-head.txt
          api/openapi.json
          client_gen.go
          error_codes_gen.go
          docs/api/routes.md
          sdk/ui/src/client/generated/
        if-no-files-found: error

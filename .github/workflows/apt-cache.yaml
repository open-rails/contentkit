name: apt-cache
# Fills the apt-install .deb cache in the release candidate's and master's
# cache scope, which their pull requests read; what a pull request saves only
# its own reruns see. A lookup ends the job when this runner image's .debs are
# already cached.
'on':
  push:
    branches: [master, 'rc/**']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: apt-cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  seed:
    name: Seed the .deb cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: ./.github/actions/apt-install
      with:
        packages: libvips-dev
        seed: 'true'

name: Release
# Root and sdk/ui releases publish @openrails/contentkit-ui at X.Y.Z to npm,
# built from the release's tag through trusted publishing with provenance.
# sdk/ui/vX.Y.Z tags publish UI-only patches without releasing the Go modules.
# Standalone component releases leave the Go/UI packages unchanged.
'on':
  release:
    types: [published]
permissions:
  contents: read
  actions: read
env:
  TAG: ${{ github.event.release.tag_name }}
jobs:
  package:
    name: Pack @openrails/contentkit-ui
    if: startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'sdk/ui/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: sdk/ui
    steps:
    - name: Version tag
      id: version
      working-directory: .
      run: |
        tag="${TAG#sdk/ui/}"
        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a vX.Y.Z or sdk/ui/vX.Y.Z tag"; exit 1; }
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
        persist-credentials: false
        fetch-depth: 0
    - name: Verify release source
      env:
        GH_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        source="$(git rev-parse HEAD)"
        if [[ "$PRERELEASE" == true && "$TAG" =~ ^sdk/ui/v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
          # UI prereleases can qualify an unmerged consumer integration. Require
          # successful source CI at this exact commit before publishing it.
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs" \
            -f head_sha="$source" -f status=success -f per_page=100 \
            --jq '.workflow_runs[] | select(.event == "pull_request" or .event == "workflow_dispatch") | .id')"
          qualified=false
          for run in $runs; do
            # Draft PR runs can succeed with every suite skipped; they do not
            # qualify a release. The real gate requires all selected suites.
            gate="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "CI Gate" and .conclusion == "success") | .id')"
            if [[ -n "$gate" ]]; then qualified=true; break; fi
          done
          [[ "$qualified" == true ]] || { echo 'UI prerelease source has no successful CI Gate.' >&2; exit 1; }
        else
          git merge-base --is-ancestor HEAD origin/master
        fi
        printf 'Release source: `%s`\n' "$source" >> "$GITHUB_STEP_SUMMARY"
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: sdk/ui/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Version from tag
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: npm version "$VERSION" --no-git-tag-version --allow-same-version
    - name: Build release artifact
      run: pnpm build
    - name: Pack
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir release
        pnpm pack --pack-destination release
        ls "release/openrails-contentkit-ui-$VERSION.tgz"
        python3 ../../.github/scripts/check-npm-package.py "release/openrails-contentkit-ui-$VERSION.tgz" "$VERSION"
    - uses: actions/upload-artifact@v4
      with:
        name: contentkit-ui
        path: sdk/ui/release/*.tgz
        if-no-files-found: error
        retention-days: 7
  npm:
    name: Publish @openrails/contentkit-ui to npm
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    env:
      PKG: '@openrails/contentkit-ui'
      VERSION: ${{ needs.package.outputs.version }}
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
    - uses: actions/download-artifact@v4
      with:
        name: contentkit-ui
    - name: Publish
      run: |
        v="$VERSION"
        need=11.5.1
        [[ "$(printf '%s\n%s\n' "$need" "$(npm --version)" | sort -V | head -1)" == "$need" ]] || { echo "::error::trusted publishing needs npm >= $need"; exit 1; }
        if npm view "$PKG@$v" version >/dev/null 2>&1; then
          echo "$PKG@$v is already on npm"
          exit 0
        fi
        latest="$(npm view "$PKG" dist-tags.latest 2>/dev/null || true)"
        if [[ "$v" == *-* ]]; then
          dist_tag=next
        elif [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -1)" != "$v" ]]; then
          dist_tag="release-${v%.*}"
        else
          dist_tag=latest
        fi
        npm publish "openrails-contentkit-ui-$v.tgz" --tag "$dist_tag" --access public --provenance

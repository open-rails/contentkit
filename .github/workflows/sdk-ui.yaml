name: UI package artifacts
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  package:
    name: UI types, contract and packed exports
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/ui
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: sdk/ui/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: sdk/ui/pnpm-lock.yaml
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm contract:check
    - run: pnpm typecheck && pnpm lint && pnpm build
    - name: Verify actual package exports, types and styles
      run: |
        pnpm pack --pack-destination "$RUNNER_TEMP"
        python3 ../../.github/scripts/check-npm-package.py "$RUNNER_TEMP/openrails-contentkit-ui-0.0.0.tgz" 0.0.0

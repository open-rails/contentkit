name: UI package artifacts
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  package:
    name: UI types, contract and packed exports
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/ui
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        package_json_file: sdk/ui/package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: sdk/ui/pnpm-lock.yaml
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm contract:check
    - run: pnpm typecheck && pnpm lint && pnpm test:read-refresh && pnpm build
    - name: Verify actual package exports, types and styles
      run: |
        pnpm pack --pack-destination "$RUNNER_TEMP"
        python3 ../../.github/scripts/check-npm-package.py "$RUNNER_TEMP/openrails-contentkit-ui-0.0.0.tgz" 0.0.0

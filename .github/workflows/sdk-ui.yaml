name: sdk-ui
# The coordinator runs only the required package/browser suites.
'on':
  workflow_call:
    inputs:
      unit:
        type: boolean
        default: true
      browser:
        type: boolean
        default: true
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sdk-ui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sdk-ui:
    name: UI package
    if: (github.event_name == 'workflow_dispatch' || inputs.unit) && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/ui
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: sdk/ui/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: sdk/ui/pnpm-lock.yaml
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - name: generated contract is fresh
      run: pnpm contract:check
    - run: pnpm check

  # Vitest's integration project and the Playwright specs against a real
  # ContentKit: e2e/server over PGroonga, MinIO and the media worker and
  # gateway built from this checkout (sdk/ui/e2e/compose.yaml).
  e2e:
    name: UI package e2e (real ContentKit)
    if: (github.event_name == 'workflow_dispatch' || inputs.browser) && !github.event.pull_request.draft
    # Playwright 1.60 supports Ubuntu 24.04; ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/ui
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: docker/setup-buildx-action@v3
    - name: build media-gateway
      uses: docker/build-push-action@v6
      with:
        context: .
        file: cmd/media-gateway/Dockerfile
        tags: ckui-e2e/media-gateway:local
        load: true
        cache-from: type=gha,scope=ckui-e2e-media-gateway
        cache-to: type=gha,mode=max,scope=ckui-e2e-media-gateway
    - name: build media-worker
      uses: docker/build-push-action@v6
      with:
        context: .
        file: cmd/media-worker/Dockerfile
        tags: ckui-e2e/media-worker:local
        load: true
        cache-from: type=gha,scope=ckui-e2e-media-worker
        cache-to: type=gha,mode=max,scope=ckui-e2e-media-worker
    - name: ffmpeg (the harness's frame grabs, the ABR source)
      run: $GITHUB_WORKSPACE/.github/scripts/apt-install.sh ffmpeg
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: sdk/ui/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: sdk/ui/pnpm-lock.yaml
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          sdk/ui/e2e/server/go.sum
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm exec playwright install --with-deps chromium
    - run: pnpm build
    - name: integration and browser suites
      run: pnpm test:e2e
      env:
        CKUI_E2E_KEEP_LOGS: '1'
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: sdk-ui-e2e-results
        path: sdk/ui/test-results
        retention-days: 7
    - name: retain ZIP upload journey screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sdk-ui-zip-journey
        path: sdk/ui/test-results/**/zip-*.png
        if-no-files-found: ignore
        retention-days: 7
    - name: tear down leftover stacks
      if: always()
      run: |
        for p in $(docker compose ls -a --format json | jq -r '.[].Name' | grep '^ckui-e2e-' || true); do
          docker compose -p "$p" -f e2e/compose.yaml --profile worker down -v --remove-orphans -t 2
        done

  gate:
    name: Selected UI suites
    needs: [sdk-ui, e2e]
    if: always() && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
        UNIT: ${{ github.event_name == 'workflow_dispatch' || inputs.unit }}
        BROWSER: ${{ github.event_name == 'workflow_dispatch' || inputs.browser }}
      run: |
        python3 - <<'PY'
        import json, os
        jobs = json.loads(os.environ['RESULTS'])
        for name, flag in [('sdk-ui', 'UNIT'), ('e2e', 'BROWSER')]:
            result = jobs[name]['result']
            if os.environ[flag] == 'true' and result != 'success':
                raise SystemExit(f'selected {name} did not pass: {result}')
            if os.environ[flag] != 'true' and result not in ('success', 'skipped'):
                raise SystemExit(f'{name} failed: {result}')
        PY

name: sdk-ui
'on':
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
    - 'sdk/ui/**'
    - 'contenturl/testdata/**'
    - 'media/*.go'
    - 'media/internal/**'
    - 'media/layout/**'
    - 'media/s3/**'
    - 'media/token/**'
    - '!**.md'
    - 'go.mod'
    - 'go.sum'
    - '.github/workflows/sdk-ui.yaml'
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: sdk-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sdk-ui:
    name: UI package
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_USER: contentkit
          POSTGRES_PASSWORD: contentkit
          POSTGRES_DB: contentkit_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U contentkit" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: sdk/ui
    env:
      CONTENTKIT_TEST_URL: postgres://contentkit:contentkit@localhost:5432/contentkit_test?sslmode=disable
      CONTENTKIT_TEST_S3_ENDPOINT: http://localhost:9100
      CONTENTKIT_TEST_S3_ACCESS_KEY: contentkit
      CONTENTKIT_TEST_S3_SECRET_KEY: contentkit-secret
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Start MinIO
      run: |
        docker run -d --name minio -p 9100:9000 \
          -e MINIO_ROOT_USER=contentkit -e MINIO_ROOT_PASSWORD=contentkit-secret \
          cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: sdk/ui/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: sdk/ui/pnpm-lock.yaml
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm check
    - name: integration (Postgres + MinIO + media.UploadHandler)
      run: |
        timeout 60 sh -c "until curl -fsS http://localhost:9100/minio/health/ready; do sleep 1; done"
        pnpm test:integration

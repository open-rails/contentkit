; The critical suite's transaction pooler in front of the job's PostgreSQL.
; Server-side prepared statements stay off: ContentKit must not need them.
[databases]
critical = host=postgres port=5432 dbname=critical
; One server connection, for the scenario that proves clients share it.
critical_one = host=postgres port=5432 dbname=critical pool_size=1

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6440
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 0
default_pool_size = 8
max_client_conn = 200
logfile = /tmp/pgbouncer/pgbouncer.log
pidfile = /tmp/pgbouncer/pgbouncer.pid
